<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♡</title>
<style>
:root{--wine:#58181F;--rose:#D58A9E;--glow:#ff4f93}
*{box-sizing:border-box;margin:0}html,body{background:#08070A;min-height:100%;overflow-x:hidden}
body{padding:7vh 5vw;display:grid;place-items:center;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.neb{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 15% 90%,rgba(190,70,130,.35),transparent 55%),radial-gradient(ellipse at 85% 10%,rgba(88,24,31,.7),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(60,25,90,.35),transparent 65%);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.1) translateX(-3%)}}
.moon{position:fixed;top:6vh;right:8vw;width:70px;height:70px;border-radius:50%;box-shadow:inset -16px 5px 0 0 #f5d9c8,0 0 40px rgba(245,217,200,.3);z-index:0}
.grain{position:fixed;inset:-50%;z-index:5;pointer-events:none;opacity:.07;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
main{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.6rem,2.2vw,1.6rem);width:min(92vw,820px)}
.s{border:0;padding:0;background:#160D16;aspect-ratio:9/16;overflow:hidden;cursor:pointer;border-radius:6px;box-shadow:0 0 0 1px rgba(213,138,158,.25),0 14px 40px #000;transition:transform .35s,box-shadow .35s;opacity:0;animation:in .8s forwards}
.s:nth-child(odd){transform:rotate(-1.2deg)}.s:nth-child(even){transform:rotate(1.2deg) translateY(10px)}
.s:hover,.s:focus-visible{transform:scale(1.04) rotate(0);box-shadow:0 0 0 1px var(--glow),0 0 40px rgba(255,79,147,.45);outline:0}
.s img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.s.miss::after{content:"♡";display:grid;place-items:center;height:100%;color:var(--rose);font-size:1.6rem}
@keyframes in{to{opacity:1}}
.lb{position:fixed;inset:0;z-index:10;background:rgba(8,7,10,.94);display:grid;place-items:center;padding:3vw;animation:fade .3s}@keyframes fade{from{opacity:0}}
.lb[hidden]{display:none}.lb img{max-width:100%;max-height:92vh;border-radius:8px;box-shadow:0 0 80px rgba(255,79,147,.25)}
.lb button{position:absolute;top:1rem;right:1.4rem;background:none;border:0;color:#F2DDE3;font-size:2.4rem;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.s{opacity:1}}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas><div class="neb" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<main id="grid" aria-label="Screenshots"></main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot" hidden><button aria-label="Close">×</button><img alt=""></div>
<script>
// Put screenshots in assets/screenshots/ as screen1.png ... screen9.png
const COUNT=9, DIR='assets/screenshots/screen';
const g=document.getElementById('grid'), lb=document.getElementById('lb'), li=lb.querySelector('img');
for(let i=1;i<=COUNT;i++){
  const b=document.createElement('button'); b.className='s'; b.style.animationDelay=(i*.12)+'s'; b.setAttribute('aria-label','Open screenshot '+i);
  const im=new Image(); im.loading='lazy'; im.alt='Chat screenshot '+i; im.src=DIR+i+'.png'; im.onerror=()=>{im.remove();b.classList.add('miss')};
  b.append(im); b.onclick=()=>{if(b.classList.contains('miss'))return;li.src=im.src;li.alt=im.alt;lb.hidden=false;lb.querySelector('button').focus()}; g.append(b);
}
lb.onclick=()=>lb.hidden=true; addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
// Stars (drawn once, gentle twinkle only if motion allowed)
const c=document.getElementById('bg'),x=c.getContext('2d'),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;let S=[];
const size=()=>{c.width=innerWidth;c.height=innerHeight;S=Array.from({length:150},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,p:Math.random()*6}))};
const draw=t=>{x.clearRect(0,0,c.width,c.height);S.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1800+s.p));x.fillStyle='#F2DDE3';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});if(!calm)setTimeout(()=>requestAnimationFrame(draw),90)};
addEventListener('resize',size);size();requestAnimationFrame(draw);
</script></body></html>
